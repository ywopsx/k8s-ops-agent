# kind 클러스터에 일부러 문제를 심어 두는 매니페스트.
# preflight가 아래 항목을 모두 찾아내는지 확인하는 용도다.
apiVersion: v1
kind: Namespace
metadata:
  name: preflight-demo
---
# [정상] 역할 라벨로 스케줄링, replica 2 → 아무것도 나오지 않아야 한다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: preflight-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: order-api}
  template:
    metadata:
      labels: {app: order-api}
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# [문제] 노드그룹 이름에 묶인 nodeSelector + replica 1
# kind에는 이 라벨을 가진 노드가 없어서 Pending으로 남는다. 점검은 spec만 본다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-batch
  namespace: preflight-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: legacy-batch}
  template:
    metadata:
      labels: {app: legacy-batch}
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: ng-legacy
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# [문제] replica 1 + minAvailable 1 PDB → disruptionsAllowed 0, drain이 멈춘다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: preflight-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment}
  template:
    metadata:
      labels: {app: payment}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment
  namespace: preflight-demo
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: payment}
---
# [문제] 컨트롤러 없는 단독 Pod
apiVersion: v1
kind: Pod
metadata:
  name: debug-shell
  namespace: preflight-demo
spec:
  containers:
    - name: shell
      image: registry.k8s.io/pause:3.10
