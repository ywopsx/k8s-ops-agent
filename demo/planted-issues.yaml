# kind 클러스터에 일부러 문제를 심어 두는 매니페스트.
# preflight가 아래 항목을 모두 찾아내는지 확인하는 용도다.
apiVersion: v1
kind: Namespace
metadata:
  name: preflight-demo
---
# [정상] 역할 라벨로 스케줄링, replica 2 → 아무것도 나오지 않아야 한다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: preflight-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: order-api}
  template:
    metadata:
      labels: {app: order-api}
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# [문제] 노드그룹 이름에 묶인 nodeSelector + replica 1
# kind에는 이 라벨을 가진 노드가 없어서 Pending으로 남는다. 점검은 spec만 본다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-batch
  namespace: preflight-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: legacy-batch}
  template:
    metadata:
      labels: {app: legacy-batch}
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: ng-legacy
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# [문제] replica 1 + minAvailable 1 PDB → disruptionsAllowed 0, drain이 멈춘다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: preflight-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment}
  template:
    metadata:
      labels: {app: payment}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment
  namespace: preflight-demo
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: payment}
---
# [문제] 컨트롤러 없는 단독 Pod
apiVersion: v1
kind: Pod
metadata:
  name: debug-shell
  namespace: preflight-demo
spec:
  containers:
    - name: shell
      image: registry.k8s.io/pause:3.10
---
# [문제] ALB Ingress, target-type 어노테이션 없음 → 기본값 instance
# kind에는 AWS Load Balancer Controller가 없어 실제 ALB는 생기지 않는다. 점검은 spec·어노테이션만 본다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront-web
  namespace: preflight-demo
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-api
                port:
                  number: 80
---
# [문제] LBC NLB Service, target type 미지정 → 기본값 instance
# kind에서는 EXTERNAL-IP가 <pending>으로 남는다.
apiVersion: v1
kind: Service
metadata:
  name: storefront-nlb
  namespace: preflight-demo
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
spec:
  type: LoadBalancer
  selector: {app: order-api}
  ports:
    - port: 80
      targetPort: 8080
---
# [정상] ip 모드 NLB Service → 나오지 않아야 한다
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: preflight-demo
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  type: LoadBalancer
  selector: {app: order-api}
  ports:
    - port: 80
      targetPort: 8080
---
# [문제] AZ 분산 강제(DoNotSchedule)
# run-demo.sh가 kind 노드에 topology.kubernetes.io/zone 라벨을 붙여 두므로 정상적으로 뜬 상태에서 검출된다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-spread
  namespace: preflight-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: zone-spread}
  template:
    metadata:
      labels: {app: zone-spread}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: zone-spread}
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
